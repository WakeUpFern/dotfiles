# Sway: xdg-desktop-portal no siempre resuelve sway-portals.conf a partir de
# XDG_CURRENT_DESKTOP, y sin esto ScreenCast/Screenshot no existen (compartir
# pantalla en navegador, Meet, Teams, Zoom u OBS falla). Se fija explícitamente.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
